<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap');
    body { margin: 0; font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
    a { color: #3182f6; } a:hover { color: #1b64da; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: #ffffff; color: #191f28; letter-spacing: -0.02em; overflow: hidden;">

  <div style="height: 56px;"></div>

  <div style="display: flex; flex-direction: column; gap: 20px; padding: 4px 20px 0;">

    <!-- 원본이 작다 — 미리보기도 작게 보인다 -->
    <div style="display: flex; align-items: center; justify-content: center; height: 240px; border-radius: 20px; background: #f2f4f6; overflow: hidden;">
      <div style="position: relative; width: 76px; height: 95px; background: linear-gradient(170deg, #dbe3ea 0%, #c8d3dd 100%);">
        <div style="position: absolute; left: 50%; top: 22px; transform: translateX(-50%); width: 30px; height: 30px; border-radius: 999px; background: #aab6c2;"></div>
        <div style="position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 52px; height: 34px; border-radius: 26px 26px 0 0; background: #9aa8b6;"></div>
      </div>
    </div>

    <div style="font-size: 13px; font-weight: 600; color: #8b95a1;">여권 (온라인 신청) 기준</div>

    <!-- blocked — 고칠 수 없는 상태다. 색만이 아니라 아이콘·문구로도 구분한다 -->
    <div style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 20px; background: #fdeced;">
      <div style="display: flex; align-items: center; gap: 9px;">
        <svg viewBox="0 0 20 20" width="20" height="20" style="flex-shrink: 0;" aria-hidden="true">
          <circle cx="10" cy="10" r="8.2" fill="none" stroke="#f04452" stroke-width="1.9"/>
          <path d="M6.8 6.8l6.4 6.4M13.2 6.8l-6.4 6.4" fill="none" stroke="#f04452" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
        <div style="font-size: 17px; font-weight: 700; color: #191f28;">이 사진은 기준보다 작아요</div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #ffffff;">
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 11px; font-weight: 600; color: #8b95a1;">필요한 크기</div>
          <div style="font-size: 18px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">413 × 531</div>
        </div>
        <div style="flex-grow: 1;"></div>
        <div style="display: flex; flex-direction: column; gap: 3px; align-items: flex-end;">
          <div style="font-size: 11px; font-weight: 600; color: #8b95a1;">지금 사진</div>
          <div style="font-size: 18px; font-weight: 800; letter-spacing: -0.02em; color: #f04452; font-variant-numeric: tabular-nums;">320 × 400</div>
        </div>
      </div>

      <div style="font-size: 13px; font-weight: 500; color: #4e5968; line-height: 1.6;">크게 늘리면 흐려져서 그대로 두었어요. 더 큰 원본으로 다시 골라 주세요.</div>
    </div>

  </div>

  <!-- 저장 경로를 막는다. 다시 고르기만 남긴다 -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 10px; padding: 0 20px 14px;">
    <div style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #3182f6; font-size: 16px; font-weight: 700; color: #ffffff;">다른 사진 고르기</div>
  </div>

</div>
</x-dc>
</body>
</html>
