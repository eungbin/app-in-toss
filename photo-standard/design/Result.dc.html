<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap');
    body { margin: 0; font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
    a { color: #3182f6; } a:hover { color: #1b64da; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: #ffffff; color: #191f28; letter-spacing: -0.02em; overflow: hidden;">

  <div style="height: 56px;"></div>

  <div style="display: flex; flex-direction: column; gap: 18px; padding: 4px 20px 0;">

    <!-- 결과 미리보기 — 규격대로 잘린 상태 -->
    <div style="display: flex; align-items: center; justify-content: center; height: 226px; border-radius: 20px; background: #f2f4f6; overflow: hidden;">
      <div style="position: relative; width: 148px; height: 190px; background: linear-gradient(170deg, #eef2f6 0%, #dde5ec 100%); box-shadow: 0 4px 12px rgba(25,31,40,0.12), 0 16px 32px -8px rgba(25,31,40,0.18);">
        <div style="position: absolute; left: 50%; top: 34px; transform: translateX(-50%); width: 62px; height: 62px; border-radius: 999px; background: #aab6c2;"></div>
        <div style="position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 108px; height: 76px; border-radius: 54px 54px 0 0; background: #9aa8b6;"></div>
      </div>
    </div>

    <!-- 결과 크기 — 이 화면에서 가장 큰 글자 -->
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 20px; background: #ffffff; box-shadow: 0 1px 2px rgba(25,31,40,0.04), 0 8px 24px -8px rgba(25,31,40,0.14);">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <div style="font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums;">413 × 531</div>
        <div style="font-size: 15px; font-weight: 700; color: #4e5968;">px</div>
        <div style="flex-grow: 1;"></div>
        <div style="display: flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 999px; background: #e8f3ff;">
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
            <path d="M4.6 8.2l2.2 2.2 4.6-5" fill="none" stroke="#1b64da" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div style="font-size: 12px; font-weight: 700; color: #1b64da;">기준에 맞아요</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: #4e5968; font-variant-numeric: tabular-nums;">
        <span>428KB</span>
        <span style="color: #d1d6db;">·</span>
        <span>JPG</span>
        <span style="color: #d1d6db;">·</span>
        <span>여권 (온라인 신청)</span>
      </div>
    </div>

    <!-- 면책 + 앱이 검사하지 않는 조건 -->
    <div style="display: flex; flex-direction: column; gap: 9px; padding: 14px 16px; border-radius: 14px; background: #fff4e6;">
      <div style="display: flex; align-items: flex-start; gap: 8px;">
        <svg viewBox="0 0 20 20" width="15" height="15" style="margin-top: 1px; flex-shrink: 0;" aria-hidden="true">
          <circle cx="10" cy="10" r="8.2" fill="none" stroke="#9a5b00" stroke-width="1.7"/>
          <path d="M10 5.8v5" fill="none" stroke="#9a5b00" stroke-width="1.9" stroke-linecap="round"/>
          <circle cx="10" cy="13.8" r="1" fill="#9a5b00"/>
        </svg>
        <div style="font-size: 12.5px; font-weight: 600; color: #9a5b00; line-height: 1.55;">기관의 최종 심사 결과는 이 앱이 보장하지 않아요. 규격 기준은 아래 출처를 확인해 주세요.</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 5px; padding-left: 23px;">
        <div style="font-size: 12px; font-weight: 500; color: #4e5968;">· 배경은 흰색이어야 해요</div>
        <div style="font-size: 12px; font-weight: 500; color: #4e5968;">· 6개월 이내에 찍은 사진이어야 해요</div>
        <div style="font-size: 12px; font-weight: 500; color: #4e5968;">· 배경을 지우거나 보정한 사진은 쓸 수 없어요</div>
        <div style="display: flex; align-items: center; gap: 4px; margin-top: 3px;">
          <div style="font-size: 12px; font-weight: 700; color: #9a5b00;">규격 출처 보기</div>
          <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true">
            <path d="M6 3.5L10.5 8L6 12.5" fill="none" stroke="#9a5b00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>

  </div>

  <!-- 하단 -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 8px; padding: 0 20px 12px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div style="display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; height: 54px; border-radius: 14px; background: #3182f6;">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M12 4v10.4M7.8 10.6L12 14.8l4.2-4.2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4.5 17.4v1.6a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1v-1.6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <div style="font-size: 16px; font-weight: 700; color: #ffffff;">사진 저장하기</div>
      </div>
      <div style="font-size: 12px; font-weight: 500; color: #8b95a1;">오늘 2/3장</div>
    </div>
    <div style="display: flex; gap: 8px;">
      <div style="flex: 1; display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 14px; background: #f2f4f6; font-size: 14px; font-weight: 600; color: #4e5968;">다시 자르기</div>
      <div style="flex: 1; display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 14px; background: #f2f4f6; font-size: 14px; font-weight: 600; color: #4e5968;">다른 사진 고르기</div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; height: 52px; box-sizing: border-box; border-radius: 12px; background: #f9fafb; border: 1px dashed #d1d6db; font-size: 11px; font-weight: 500; color: #b0b8c1;">배너 광고</div>
  </div>

</div>
</x-dc>
</body>
</html>
