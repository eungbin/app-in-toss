<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap');
    body { margin: 0; font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
    a { color: #3182f6; } a:hover { color: #1b64da; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: #ffffff; color: #191f28; letter-spacing: -0.02em; overflow: hidden;">

  <!-- 상단 56px 은 토스가 그리는 네비게이션 바 자리 -->
  <div style="height: 56px;"></div>

  <div style="display: flex; flex-direction: column; gap: 20px; padding: 4px 20px 0;">

    <!-- 미리보기 — 항상 contain. 잘라 보여 주지 않는다 -->
    <div style="display: flex; align-items: center; justify-content: center; height: 240px; border-radius: 20px; background: #f2f4f6; overflow: hidden;">
      <div style="position: relative; width: 135px; height: 180px; background: linear-gradient(170deg, #dbe3ea 0%, #c8d3dd 100%);">
        <div style="position: absolute; left: 50%; top: 44px; transform: translateX(-50%); width: 54px; height: 54px; border-radius: 999px; background: #aab6c2;"></div>
        <div style="position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 92px; height: 62px; border-radius: 46px 46px 0 0; background: #9aa8b6;"></div>
      </div>
    </div>

    <!-- 판정 -->
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="font-size: 13px; font-weight: 600; color: #8b95a1;">여권 (온라인 신청) 기준</div>

      <div style="display: flex; flex-direction: column; gap: 2px; padding: 6px 16px; border-radius: 20px; background: #ffffff; box-shadow: 0 1px 2px rgba(25,31,40,0.04), 0 8px 24px -8px rgba(25,31,40,0.14);">

        <div style="display: flex; align-items: center; gap: 10px; height: 46px;">
          <svg viewBox="0 0 20 20" width="18" height="18" style="flex-shrink: 0;" aria-hidden="true">
            <circle cx="10" cy="10" r="8.2" fill="none" stroke="#3182f6" stroke-width="1.8"/>
            <path d="M6.3 10.2l2.6 2.6 4.8-5.2" fill="none" stroke="#3182f6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div style="width: 40px; font-size: 14px; font-weight: 600; color: #4e5968;">가로</div>
          <div style="flex-grow: 1; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: #8b95a1; font-variant-numeric: tabular-nums;"><span>1200</span><svg viewBox="0 0 16 16" width="11" height="11" style="flex-shrink: 0;" aria-hidden="true"><path d="M2.6 8h9.4M8.8 4.8L12 8l-3.2 3.2" fill="none" stroke="#b0b8c1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>413</span></div>
          <div style="font-size: 13px; font-weight: 700; color: #3182f6; white-space: nowrap;">기준에 맞아요</div>
        </div>

        <div style="height: 1px; background: #f2f4f6;"></div>

        <div style="display: flex; align-items: center; gap: 10px; height: 46px;">
          <svg viewBox="0 0 20 20" width="18" height="18" style="flex-shrink: 0;" aria-hidden="true">
            <circle cx="10" cy="10" r="8.2" fill="none" stroke="#3182f6" stroke-width="1.8"/>
            <path d="M6.3 10.2l2.6 2.6 4.8-5.2" fill="none" stroke="#3182f6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div style="width: 40px; font-size: 14px; font-weight: 600; color: #4e5968;">세로</div>
          <div style="flex-grow: 1; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: #8b95a1; font-variant-numeric: tabular-nums;"><span>1600</span><svg viewBox="0 0 16 16" width="11" height="11" style="flex-shrink: 0;" aria-hidden="true"><path d="M2.6 8h9.4M8.8 4.8L12 8l-3.2 3.2" fill="none" stroke="#b0b8c1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>531</span></div>
          <div style="font-size: 13px; font-weight: 700; color: #3182f6; white-space: nowrap;">기준에 맞아요</div>
        </div>

        <div style="height: 1px; background: #f2f4f6;"></div>

        <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 0;">
          <svg viewBox="0 0 20 20" width="18" height="18" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true">
            <circle cx="10" cy="10" r="8.2" fill="none" stroke="#9a5b00" stroke-width="1.8"/>
            <path d="M10 5.8v5" fill="none" stroke="#9a5b00" stroke-width="2" stroke-linecap="round"/>
            <circle cx="10" cy="13.8" r="1.05" fill="#9a5b00"/>
          </svg>
          <div style="width: 40px; font-size: 14px; font-weight: 600; color: #4e5968;">용량</div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
            <div style="font-size: 14px; font-weight: 500; color: #8b95a1; font-variant-numeric: tabular-nums;">1.8MB</div>
            <div style="font-size: 12px; font-weight: 500; color: #9a5b00;">500KB 이하가 필요해요</div>
          </div>
          <div style="font-size: 13px; font-weight: 700; color: #9a5b00; margin-top: 1px; white-space: nowrap;">기준을 넘었어요</div>
        </div>

        <div style="height: 1px; background: #f2f4f6;"></div>

        <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 0;">
          <svg viewBox="0 0 20 20" width="18" height="18" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true">
            <circle cx="10" cy="10" r="8.2" fill="none" stroke="#9a5b00" stroke-width="1.8"/>
            <path d="M10 5.8v5" fill="none" stroke="#9a5b00" stroke-width="2" stroke-linecap="round"/>
            <circle cx="10" cy="13.8" r="1.05" fill="#9a5b00"/>
          </svg>
          <div style="width: 40px; font-size: 14px; font-weight: 600; color: #4e5968;">비율</div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
            <div style="font-size: 14px; font-weight: 500; color: #8b95a1;">3 : 4</div>
            <div style="font-size: 12px; font-weight: 500; color: #9a5b00;">자르기가 필요해요</div>
          </div>
          <div style="font-size: 13px; font-weight: 700; color: #9a5b00; margin-top: 1px; white-space: nowrap;">기준과 달라요</div>
        </div>

        <div style="height: 1px; background: #f2f4f6;"></div>

        <div style="display: flex; align-items: center; gap: 10px; height: 46px;">
          <svg viewBox="0 0 20 20" width="18" height="18" style="flex-shrink: 0;" aria-hidden="true">
            <circle cx="10" cy="10" r="8.2" fill="none" stroke="#3182f6" stroke-width="1.8"/>
            <path d="M6.3 10.2l2.6 2.6 4.8-5.2" fill="none" stroke="#3182f6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <div style="width: 40px; font-size: 14px; font-weight: 600; color: #4e5968;">형식</div>
          <div style="flex-grow: 1; font-size: 14px; font-weight: 500; color: #8b95a1;">JPG</div>
          <div style="font-size: 13px; font-weight: 700; color: #3182f6; white-space: nowrap;">기준에 맞아요</div>
        </div>

      </div>
    </div>

  </div>

  <!-- 하단 -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 10px; padding: 0 20px 14px;">
    <div style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #3182f6; font-size: 16px; font-weight: 700; color: #ffffff;">규격에 맞추기</div>
    <div style="display: flex; gap: 8px;">
      <div style="flex: 1; display: flex; align-items: center; justify-content: center; height: 46px; border-radius: 14px; background: #f2f4f6; font-size: 14px; font-weight: 600; color: #4e5968;">다른 사진 고르기</div>
      <div style="display: flex; align-items: center; justify-content: center; gap: 4px; height: 46px; padding: 0 16px; border-radius: 14px; background: #f2f4f6;">
        <div style="font-size: 14px; font-weight: 600; color: #4e5968;">규격 출처</div>
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
          <path d="M6 3.5L10.5 8L6 12.5" fill="none" stroke="#8b95a1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
