<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap');
    body { margin: 0; font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
    a { color: #3182f6; } a:hover { color: #1b64da; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: #ffffff; color: #191f28; letter-spacing: -0.02em; overflow: hidden;">

  <!-- 상단 56px 은 토스가 그리는 네비게이션 바 자리 -->
  <div style="height: 56px;"></div>

  <div style="display: flex; flex-direction: column; gap: 22px; padding: 4px 20px 0;">

    <!-- 사진 자리 (빈 상태) -->
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; height: 172px; border-radius: 20px; background: #f2f4f6;">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
        <path d="M5 8.5h22a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1z" fill="none" stroke="#b0b8c1" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="12" cy="14.5" r="2.4" fill="none" stroke="#b0b8c1" stroke-width="2"/>
        <path d="M4 20l6.5-5 6 5.5M18 18.5l4-3.5 6 5" fill="none" stroke="#b0b8c1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div style="font-size: 14px; font-weight: 500; color: #8b95a1; text-align: center; line-height: 1.5;">사진을 고르면<br>규격에 맞는지 확인해 드려요</div>
    </div>

    <!-- 입력 -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 14px; background: #3182f6;">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
          <path d="M4 6.6h16a1 1 0 0 1 1 1v9.8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7.6a1 1 0 0 1 1-1z" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linejoin="round"/>
          <path d="M3 15l5-4 4.5 4M14 13.5l3-2.5 4 3.5" fill="none" stroke="#ffffff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div style="font-size: 16px; font-weight: 700; color: #ffffff;">앨범에서 고르기</div>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 14px; background: #f2f4f6;">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
          <path d="M3.8 7.8h3.4l1.6-2.2h6.4l1.6 2.2h3.4a1 1 0 0 1 1 1v9.4a1 1 0 0 1-1 1H3.8a1 1 0 0 1-1-1V8.8a1 1 0 0 1 1-1z" fill="none" stroke="#4e5968" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="12" cy="13.4" r="3.5" fill="none" stroke="#4e5968" stroke-width="1.8"/>
        </svg>
        <div style="font-size: 15px; font-weight: 600; color: #4e5968;">카메라로 찍기</div>
      </div>
    </div>

    <!-- 프리셋 -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 13px; font-weight: 600; color: #8b95a1;">어디에 쓸 사진인가요?</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 58px; box-sizing: border-box; border-radius: 14px; background: #e8f3ff; border: 1.5px solid #3182f6;">
          <div style="font-size: 13px; font-weight: 700; color: #1b64da;">여권</div>
          <div style="font-size: 11px; font-weight: 500; color: #3182f6;">온라인</div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 58px; border-radius: 14px; background: #f2f4f6;">
          <div style="font-size: 13px; font-weight: 600; color: #4e5968;">여권</div>
          <div style="font-size: 11px; font-weight: 500; color: #8b95a1;">인화용</div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 58px; border-radius: 14px; background: #f2f4f6;">
          <div style="font-size: 13px; font-weight: 600; color: #4e5968;">운전면허</div>
          <div style="font-size: 11px; font-weight: 500; color: #8b95a1;">온라인</div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 58px; border-radius: 14px; background: #f2f4f6;">
          <div style="font-size: 13px; font-weight: 600; color: #4e5968;">미국 비자</div>
          <div style="font-size: 11px; font-weight: 500; color: #8b95a1;">정사각</div>
        </div>
        <div style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 58px; border-radius: 14px; background: #f2f4f6;">
          <div style="font-size: 13px; font-weight: 600; color: #4e5968;">증명사진</div>
          <div style="font-size: 11px; font-weight: 500; color: #8b95a1;">3 × 4 cm</div>
          <div style="position: absolute; top: -5px; right: -3px; padding: 2px 6px; border-radius: 999px; background: #e5e8eb; font-size: 10px; font-weight: 700; color: #6b7684;">관행</div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 58px; border-radius: 14px; background: #f2f4f6;">
          <div style="font-size: 13px; font-weight: 600; color: #4e5968;">직접 입력</div>
          <div style="font-size: 11px; font-weight: 500; color: #8b95a1;">px · KB</div>
        </div>
      </div>
    </div>

    <!-- 선택한 규격 — 이 화면에서 가장 큰 글자 -->
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 20px; background: #ffffff; box-shadow: 0 1px 2px rgba(25,31,40,0.04), 0 8px 24px -8px rgba(25,31,40,0.14);">
      <div style="font-size: 12px; font-weight: 600; color: #8b95a1;">선택한 규격</div>
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <div style="font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums;">413 × 531</div>
        <div style="font-size: 15px; font-weight: 700; color: #4e5968;">px</div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: #4e5968;">
        <span>500KB 이하</span>
        <span style="color: #d1d6db;">·</span>
        <span>JPG</span>
        <span style="color: #d1d6db;">·</span>
        <span>3.5 × 4.5 cm</span>
      </div>
      <div style="display: flex; align-items: center; gap: 4px; margin: -6px -8px -8px; padding: 8px; border-radius: 10px;">
        <div style="font-size: 11px; font-weight: 500; color: #8b95a1;">외교부 여권안내 · 확인일 2026-09-08</div>
        <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true">
          <path d="M6 3.5L10.5 8L6 12.5" fill="none" stroke="#b0b8c1" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

  </div>

  <!-- 하단 고정 영역: 개인정보 문구 + 배너 -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 10px; padding: 0 20px 12px;">
    <div style="display: flex; align-items: flex-start; gap: 7px;">
      <svg viewBox="0 0 20 20" width="14" height="14" style="margin-top: 1px; flex-shrink: 0;" aria-hidden="true">
        <path d="M10 2.5l6 2.2v4.6c0 3.5-2.4 6.6-6 7.7-3.6-1.1-6-4.2-6-7.7V4.7z" fill="none" stroke="#8b95a1" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M7.4 10.1l1.9 1.9 3.4-3.6" fill="none" stroke="#8b95a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div style="font-size: 12px; font-weight: 500; color: #8b95a1; line-height: 1.5;">사진은 이 기기 안에서만 처리돼요. 어디에도 올라가지 않아요.</div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; height: 52px; box-sizing: border-box; border-radius: 12px; background: #f9fafb; border: 1px dashed #d1d6db; font-size: 11px; font-weight: 500; color: #b0b8c1;">배너 광고</div>
  </div>

</div>
</x-dc>
</body>
</html>
