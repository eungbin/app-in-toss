<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap');
    body { margin: 0; font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
    a { color: #3182f6; } a:hover { color: #1b64da; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: #191f28; color: #ffffff; letter-spacing: -0.02em; overflow: hidden;">

  <div style="height: 56px;"></div>

  <!-- 자르기 무대 -->
  <div style="position: relative; height: 642px; overflow: hidden;">
    <!-- 소스 이미지 -->
    <div style="position: absolute; inset: 0; background: linear-gradient(170deg, #dbe3ea 0%, #b9c6d2 100%);"></div>
    <div style="position: absolute; left: 50%; top: 208px; transform: translateX(-50%); width: 132px; height: 132px; border-radius: 999px; background: #a3b1bf;"></div>
    <div style="position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 250px; height: 230px; border-radius: 125px 125px 0 0; background: #93a2b1;"></div>

    <!-- 마스크 4장 — 크롭 박스 바깥을 덮는다 -->
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 124px; background: rgba(0,0,0,0.55);"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 124px; background: rgba(0,0,0,0.55);"></div>
    <div style="position: absolute; left: 0; top: 124px; bottom: 124px; width: 42px; background: rgba(0,0,0,0.55);"></div>
    <div style="position: absolute; right: 0; top: 124px; bottom: 124px; width: 42px; background: rgba(0,0,0,0.55);"></div>

    <!-- 크롭 박스 — 모서리 핸들을 두지 않는다. 비율을 바꿀 수 있다고 읽힌다 -->
    <div style="position: absolute; left: 42px; right: 42px; top: 124px; bottom: 124px; border: 2px solid #ffffff;">
      <div style="position: absolute; left: 0; right: 0; top: 33.33%; height: 1px; background: rgba(255,255,255,0.32);"></div>
      <div style="position: absolute; left: 0; right: 0; top: 66.66%; height: 1px; background: rgba(255,255,255,0.32);"></div>
      <div style="position: absolute; top: 0; bottom: 0; left: 33.33%; width: 1px; background: rgba(255,255,255,0.32);"></div>
      <div style="position: absolute; top: 0; bottom: 0; left: 66.66%; width: 1px; background: rgba(255,255,255,0.32);"></div>
      <div style="position: absolute; left: 50%; top: -13px; transform: translateX(-50%); padding: 3px 10px; border-radius: 999px; background: #ffffff; font-size: 11px; font-weight: 700; color: #191f28; letter-spacing: -0.01em;">3.5 : 4.5 고정</div>
    </div>
  </div>

  <!-- 안내 + 확정 -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 16px; padding: 22px 20px 14px;">
    <div style="display: flex; align-items: flex-start; gap: 8px;">
      <svg viewBox="0 0 20 20" width="15" height="15" style="margin-top: 2px; flex-shrink: 0;" aria-hidden="true">
        <rect x="3.2" y="3.2" width="13.6" height="13.6" rx="2.2" fill="none" stroke="#b0b8c1" stroke-width="1.6"/>
        <path d="M7.6 10h4.8M10 7.6v4.8" fill="none" stroke="#b0b8c1" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <div style="font-size: 13px; font-weight: 500; color: #b0b8c1; line-height: 1.55;">비율은 규격에 맞춰 고정돼 있어요.<br>움직이거나 크기만 바꿀 수 있어요.</div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #3182f6; font-size: 16px; font-weight: 700; color: #ffffff;">이대로 맞추기</div>
  </div>

</div>
</x-dc>
</body>
</html>
